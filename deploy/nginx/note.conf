# =============================================================================
# CipherWS 笔记站（note）—— 单体后端 Nginx 配置
#
# 前提：
#   1. 前端已构建到 /opt/cipherws-note/frontend/note/dist
#   2. 后端单体应用监听 8084
#   3. 证书放在 /etc/nginx/ssl/note.cipherws.icu.{pem,key}
#
# Nginx 是入口网关：/api/** 去掉 /api 前缀后转给 8084，/uploads/** 原样转发。
# 如果 Nginx 与后端不在同一台机器（ECS + SakuraFrp），只需要给 8084 开一条隧道，
# 或直接改 upstream 为隧道地址，并补 Host / proxy_ssl_name。
# =============================================================================

upstream note_backend {
    server 127.0.0.1:8084;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# HTTP：ACME 续期 + 跳 HTTPS
# -----------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name note.cipherws.icu;

    access_log /var/log/nginx/cipherws-note.access.log;
    error_log  /var/log/nginx/cipherws-note.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS：静态前端 + 单体后端
# -----------------------------------------------------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name note.cipherws.icu;

    access_log /var/log/nginx/cipherws-note.access.log;
    error_log  /var/log/nginx/cipherws-note.error.log;

    ssl_certificate     /etc/nginx/ssl/note.cipherws.icu.pem;
    ssl_certificate_key /etc/nginx/ssl/note.cipherws.icu.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # 头像上限 2MB，给 multipart 留余量
    client_max_body_size 4m;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 接口：单体后端 8084 ----------
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass         http://note_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # AI 总结是同步调用第三方模型，慢的时候十几秒
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;

        add_header Cache-Control "no-store";
    }

    # ---------- 头像：公开路径，不校验 token ----------
    location /uploads/ {
        proxy_pass         http://note_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------- 前端构建产物 ----------
    root  /opt/cipherws-note/frontend/note/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        access_log off;
    }

    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }
}
